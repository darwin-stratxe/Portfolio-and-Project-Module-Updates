<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090" role="img" aria-labelledby="title desc">
<title id="title">Proposed StratXe integration model</title><desc id="desc">Strategy, annual performance planning and departmental operational planning connect to a cross-department portfolio decision layer. Authorised programmes and standalone projects deliver capabilities into operations. Validated evidence returns through performance reporting to portfolio review. Resources constrain both layers.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#526879"/></marker></defs>
<rect width="1400" height="1090" fill="#f4f7fa"/>
<style>text{font-family:Arial,sans-serif;fill:#183042}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#506577}.heading{font-size:18px;font-weight:700;letter-spacing:1px}.boxhead{font-size:23px;font-weight:700}.body{font-size:18px}.edge{font-size:16px;fill:#455d70}.small{font-size:15px;fill:#526879}</style>

<text x="55" y="53" class="title" text-anchor="start">StratXe: connect planning to investment decisions</text>
<text x="55" y="85" class="sub" text-anchor="start">Proposed architecture · 16 September 2026 · Existing module locations and interfaces require confirmation</text>
<text x="55" y="137" class="heading" text-anchor="start">PLANNING AND ACCOUNTABILITY</text>
<text x="840" y="137" class="heading" text-anchor="start">CROSS-DEPARTMENT CHANGE</text>
<rect x="55" y="160" width="500" height="102" rx="12" fill="#ffffff" stroke="#cbd6df" stroke-width="2"/>
<text x="79" y="195" class="boxhead" text-anchor="start">SP · strategic direction</text>
<text x="79" y="225" class="body" text-anchor="start">Outcomes, priorities and strategic assumptions</text>
<rect x="55" y="309" width="500" height="102" rx="12" fill="#ffffff" stroke="#cbd6df" stroke-width="2"/>
<text x="79" y="344" class="boxhead" text-anchor="start">APP · annual commitments</text>
<text x="79" y="374" class="body" text-anchor="start">Targets, reporting periods and approved changes</text>
<rect x="55" y="459" width="500" height="102" rx="12" fill="#ffffff" stroke="#cbd6df" stroke-width="2"/>
<text x="79" y="494" class="boxhead" text-anchor="start">AOP · departmental execution</text>
<text x="79" y="524" class="body" text-anchor="start">Activities, requests and resource commitments</text>
<rect x="840" y="160" width="505" height="300" rx="12" fill="#e4f5fa" stroke="#2aa9c7" stroke-width="2"/>
<text x="864" y="195" class="boxhead" text-anchor="start">Portfolio · new decision layer</text>
<text x="864" y="225" class="body" text-anchor="start">Mandate, charter and roadmap</text>
<text x="864" y="251" class="body" text-anchor="start">Shared intake from three origins</text>
<text x="864" y="277" class="body" text-anchor="start">Assess, prioritise and balance work</text>
<text x="864" y="303" class="body" text-anchor="start">Authorise within delegated authority</text>
<text x="864" y="329" class="body" text-anchor="start">Review delivery, risk and expected value</text>
<text x="864" y="355" class="body" text-anchor="start"></text>
<text x="864" y="381" class="body" text-anchor="start">Enduring identity; versioned plans</text>
<rect x="840" y="570" width="505" height="143" rx="12" fill="#ffffff" stroke="#cbd6df" stroke-width="2"/>
<text x="864" y="605" class="boxhead" text-anchor="start">Authorised delivery</text>
<text x="864" y="635" class="body" text-anchor="start">Programmes coordinate related change</text>
<text x="864" y="661" class="body" text-anchor="start">Projects deliver agreed scope</text>
<text x="864" y="687" class="body" text-anchor="start">Standalone projects are permitted</text>
<rect x="55" y="610" width="500" height="103" rx="12" fill="#ffffff" stroke="#cbd6df" stroke-width="2"/>
<text x="79" y="645" class="boxhead" text-anchor="start">Operations · recurring work</text>
<text x="79" y="675" class="body" text-anchor="start">Adopt capabilities and realise benefits</text>
<rect x="55" y="818" width="1290" height="103" rx="12" fill="#eaf3ee" stroke="#8ab39a" stroke-width="2"/>
<text x="79" y="853" class="boxhead" text-anchor="start">Performance · validated results and evidence</text>
<text x="79" y="883" class="body" text-anchor="start">Official indicator ownership stays in existing planning / performance functions; portfolio uses linked evidence.</text>
