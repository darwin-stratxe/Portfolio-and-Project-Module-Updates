<text x="695" y="541" class="edge" text-anchor="middle">Demand and capacity</text>
<path d="M1092 460 V570" fill="none" stroke="#526879" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1110" y="515" class="edge" text-anchor="start">Authorised scope,</text>
<text x="1110" y="538" class="edge" text-anchor="start">funding and conditions</text>
