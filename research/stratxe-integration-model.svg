<text x="697" y="643" class="edge" text-anchor="middle">Accepted capability</text>
<path d="M305 713 V818" fill="none" stroke="#526879" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="321" y="768" class="edge" text-anchor="start">Measured results</text>
<path d="M1092 713 V818" fill="none" stroke="#526879" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1110" y="768" class="edge" text-anchor="start">Delivery evidence</text>
<path d="M1345 867 H1374 V310 H1345" fill="none" stroke="#526879" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1364" y="716" transform="rotate(-90 1364 716)" class="small">Evidence informs portfolio review</text>
<rect x="55" y="955" width="1290" height="67" rx="10" fill="#183042"/>
<text x="79" y="983" style="font:700 19px Arial;fill:white">Shared constraints: people, skills, funding and organisational capacity</text>
<text x="79" y="1009" style="font:17px Arial;fill:#dce8ee">Available for new work = capacity − BAU − leave / reserves − existing commitments. Authorities confirm allocations.</text>
<text x="55" y="1058" class="small" text-anchor="start">Original StratXe proposal informed by PMI organisational context; not a reproduction of Figure 1-3. Arrows show information and decisions.</text>
